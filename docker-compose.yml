services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: market_analyzer
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://market_user:market_password@postgres:5432/market_analyzer
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
volumes:
  postgres_data:
